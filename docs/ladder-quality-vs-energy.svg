<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-labelledby="t d">
<title id="t">Quality versus GPU energy per answer across the quantisation ladder</title>
<desc id="d">Two scatter panels over GPU energy per answer. Left: accuracy. Right: hallucination rate on unanswerable questions. Five configurations of Qwen2.5-Instruct: 1.5B at FP16, Q8_0 and Q4_K_M, and 7B at Q8_0 and Q4_K_M. The 7B models are far more accurate and far less prone to hallucination but cost about four times the energy per answer. Values are in the accompanying table.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.bg{fill:var(--surface)} .h1{font-size:16px;font-weight:600;fill:var(--ink)} .h2{font-size:12px;fill:var(--ink2)}
.panel{font-size:13px;font-weight:600;fill:var(--ink)} .tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.axis-title{font-size:12px;fill:var(--ink2)} .lab{font-size:12px;fill:var(--ink2)} .note{font-size:11px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .base{stroke:var(--axis);stroke-width:1} .front{stroke:var(--muted);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.m1{fill:var(--s1)} .m2{fill:var(--s2)} .ring{stroke:var(--surface);stroke-width:2}
</style>
<rect class="bg" width="920" height="480"/>
<text class="h1" x="24" y="30">Quality versus GPU energy per answer</text>
<text class="h2" x="24" y="50">Qwen2.5-Instruct on the SQuAD 2.0 dev subset (100 + 100 questions), after the citation policy. RTX A4500 laptop GPU at its power limit.</text>
<circle class="m1 ring" cx="32" cy="80" r="6"/><text class="lab" x="44" y="84">1.5B parameters</text>
<rect class="m2 ring" x="166" y="74" width="12" height="12" rx="2"/><text class="lab" x="184" y="84">7B parameters</text>
<text class="note" x="290" y="84">Precision is labelled on each point. A line joins the efficient set.</text>
<text class="panel" x="60" y="106">Accuracy (higher is better)</text>
<line class="base" x1="60" x2="430" y1="370.0" y2="370.0"/>
<text class="tick" x="52" y="374.0" text-anchor="end">0%</text>
<line class="grid" x1="60" x2="430" y1="320.0" y2="320.0"/>
<text class="tick" x="52" y="324.0" text-anchor="end">20%</text>
<line class="grid" x1="60" x2="430" y1="270.0" y2="270.0"/>
<text class="tick" x="52" y="274.0" text-anchor="end">40%</text>
<line class="grid" x1="60" x2="430" y1="220.0" y2="220.0"/>
<text class="tick" x="52" y="224.0" text-anchor="end">60%</text>
<line class="grid" x1="60" x2="430" y1="170.0" y2="170.0"/>
<text class="tick" x="52" y="174.0" text-anchor="end">80%</text>
<line class="grid" x1="60" x2="430" y1="120.0" y2="120.0"/>
<text class="tick" x="52" y="124.0" text-anchor="end">100%</text>
<text class="tick" x="60.0" y="388" text-anchor="middle">0</text>
<text class="tick" x="112.9" y="388" text-anchor="middle">10</text>
<text class="tick" x="165.7" y="388" text-anchor="middle">20</text>
<text class="tick" x="218.6" y="388" text-anchor="middle">30</text>
<text class="tick" x="271.4" y="388" text-anchor="middle">40</text>
<text class="tick" x="324.3" y="388" text-anchor="middle">50</text>
<text class="tick" x="377.1" y="388" text-anchor="middle">60</text>
<text class="tick" x="430.0" y="388" text-anchor="middle">70</text>
<text class="axis-title" x="245.0" y="410" text-anchor="middle">GPU energy per answer (joules, lower is better)</text>
<polyline class="front" points="124.6,300.0 152.1,247.5 356.7,185.0"/>
<circle class="m1 ring" cx="171.8" cy="247.5" r="6"><title>1.5B FP16: 21.1 J per answer, accuracy 49%, hallucination 76%</title></circle>
<text class="lab" x="171.8" y="271.5" text-anchor="middle">FP16</text>
<circle class="m1 ring" cx="152.1" cy="247.5" r="6"><title>1.5B Q8_0: 17.4 J per answer, accuracy 49%, hallucination 72%</title></circle>
<text class="lab" x="152.1" y="234.5" text-anchor="middle">Q8_0</text>
<circle class="m1 ring" cx="124.6" cy="300.0" r="6"><title>1.5B Q4_K_M: 12.2 J per answer, accuracy 28%, hallucination 33%</title></circle>
<text class="lab" x="135.6" y="304.0" text-anchor="start">Q4_K_M</text>
<rect class="m2 ring" x="390.7" y="179.0" width="12" height="12" rx="2"><title>7B Q8_0: 63.7 J per answer, accuracy 74%, hallucination 30%</title></rect>
<text class="lab" x="396.7" y="172.0" text-anchor="middle">Q8_0</text>
<rect class="m2 ring" x="350.7" y="179.0" width="12" height="12" rx="2"><title>7B Q4_K_M: 56.1 J per answer, accuracy 74%, hallucination 31%</title></rect>
<text class="lab" x="356.7" y="172.0" text-anchor="middle">Q4_K_M</text>
<text class="panel" x="530" y="106">Hallucination on unanswerable questions (lower is better)</text>
<line class="base" x1="530" x2="900" y1="370.0" y2="370.0"/>
<text class="tick" x="522" y="374.0" text-anchor="end">0%</text>
<line class="grid" x1="530" x2="900" y1="320.0" y2="320.0"/>
<text class="tick" x="522" y="324.0" text-anchor="end">20%</text>
<line class="grid" x1="530" x2="900" y1="270.0" y2="270.0"/>
<text class="tick" x="522" y="274.0" text-anchor="end">40%</text>
<line class="grid" x1="530" x2="900" y1="220.0" y2="220.0"/>
<text class="tick" x="522" y="224.0" text-anchor="end">60%</text>
<line class="grid" x1="530" x2="900" y1="170.0" y2="170.0"/>
<text class="tick" x="522" y="174.0" text-anchor="end">80%</text>
<line class="grid" x1="530" x2="900" y1="120.0" y2="120.0"/>
<text class="tick" x="522" y="124.0" text-anchor="end">100%</text>
<text class="tick" x="530.0" y="388" text-anchor="middle">0</text>
<text class="tick" x="582.9" y="388" text-anchor="middle">10</text>
<text class="tick" x="635.7" y="388" text-anchor="middle">20</text>
<text class="tick" x="688.6" y="388" text-anchor="middle">30</text>
<text class="tick" x="741.4" y="388" text-anchor="middle">40</text>
<text class="tick" x="794.3" y="388" text-anchor="middle">50</text>
<text class="tick" x="847.1" y="388" text-anchor="middle">60</text>
<text class="tick" x="900.0" y="388" text-anchor="middle">70</text>
<text class="axis-title" x="715.0" y="410" text-anchor="middle">GPU energy per answer (joules, lower is better)</text>
<circle class="m1 ring" cx="641.8" cy="180.0" r="6"><title>1.5B FP16: 21.1 J per answer, accuracy 49%, hallucination 76%</title></circle>
<text class="lab" x="652.8" y="184.0" text-anchor="start">FP16</text>
<circle class="m1 ring" cx="622.1" cy="190.0" r="6"><title>1.5B Q8_0: 17.4 J per answer, accuracy 49%, hallucination 72%</title></circle>
<text class="lab" x="611.1" y="194.0" text-anchor="end">Q8_0</text>
<circle class="m1 ring" cx="594.6" cy="287.5" r="6"><title>1.5B Q4_K_M: 12.2 J per answer, accuracy 28%, hallucination 33%</title></circle>
<text class="lab" x="605.6" y="291.5" text-anchor="start">Q4_K_M</text>
<rect class="m2 ring" x="860.7" y="289.0" width="12" height="12" rx="2"><title>7B Q8_0: 63.7 J per answer, accuracy 74%, hallucination 30%</title></rect>
<text class="lab" x="866.7" y="282.0" text-anchor="middle">Q8_0</text>
<rect class="m2 ring" x="820.7" y="286.5" width="12" height="12" rx="2"><title>7B Q4_K_M: 56.1 J per answer, accuracy 74%, hallucination 31%</title></rect>
<text class="lab" x="826.7" y="316.5" text-anchor="middle">Q4_K_M</text>
<text class="note" x="24" y="458">Accuracy is capped at 91% by retrieval (gold paragraph in the top 4). One run per configuration; 100 questions per kind, so differences of a few points are noise.</text>
<text class="note" x="24" y="472">GPU board energy (not system power), integrated over cooled, short bursts. Not an edge-device measurement. Values: docs/ladder.md.</text>
</svg>
