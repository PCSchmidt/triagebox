[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triagebox"
version = "0.1.0"
description = "Air-gapped, citation-forced edge LLM triage over public documents (scaffold)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Signed bundles use Ed25519 from `cryptography`.
sync = ["cryptography>=42"]
dev = ["pytest>=8", "cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
